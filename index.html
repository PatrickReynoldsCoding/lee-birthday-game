// =====================================================================
//  Pixel canvas: tiny rasteriser used to build every sprite
// =====================================================================
class PC{
  constructor(w,h){this.w=w;this.h=h;this.d=new Array(w*h).fill(null);this.mask=null}
  set(x,y,c){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=this.w||y>=this.h)return;const i=y*this.w+x;
    if(this.mask&&!this.mask.has(this.d[i]))return;this.d[i]=c}
  get(x,y){if(x<0||y<0||x>=this.w||y>=this.h)return null;return this.d[y*this.w+x]}
  masked(cols,fn){this.mask=new Set(cols);fn();this.mask=null}
  rect(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.set(x+i,y+j,c)}
  ell(cx,cy,rx,ry,c){const x0=Math.floor(cx-rx-1),x1=Math.ceil(cx+rx+1),y0=Math.floor(cy-ry-1),y1=Math.ceil(cy+ry+1);
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)this.set(x,y,c)}}
  tri(ax,ay,bx,by,cx,cy,c){const s=(px,py,x1,y1,x2,y2)=>(px-x2)*(y1-y2)-(x1-x2)*(py-y2);
    for(let y=Math.floor(Math.min(ay,by,cy));y<=Math.ceil(Math.max(ay,by,cy));y++)
      for(let x=Math.floor(Math.min(ax,bx,cx));x<=Math.ceil(Math.max(ax,bx,cx));x++){
        const px=x+.5,py=y+.5,d1=s(px,py,ax,ay,bx,by),d2=s(px,py,bx,by,cx,cy),d3=s(px,py,cx,cy,ax,ay);
        if(!((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0)))this.set(x,y,c)}}
  line(x0,y0,x1,y1,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
    const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
    for(;;){this.set(x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
  stroke(pts,r,c){for(let i=0;i<pts.length-1;i++){const[a,b]=pts[i],[x2,y2]=pts[i+1];const n=Math.ceil(Math.hypot(x2-a,y2-b)*2)||1;
    for(let k=0;k<=n;k++){const t=k/n;this.ell(a+(x2-a)*t,b+(y2-b)*t,r,r,c)}}}
  shade(cols,c,dx,dy,dist){const s=new Set(cols),L=[];for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++)
    if(s.has(this.d[y*this.w+x])&&this.get(x+dx*dist,y+dy*dist)===null)L.push(y*this.w+x);L.forEach(i=>this.d[i]=c)}
  outline(c){const L=[];for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){if(this.d[y*this.w+x]!==null)continue;
    for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){const v=this.get(x+a,y+b);if(v!==null&&v!==c){L.push(y*this.w+x);break}}}
    L.forEach(i=>this.d[i]=c)}
  canvas(){const c=document.createElement('canvas');c.width=this.w;c.height=this.h;const x=c.getContext('2d');
    for(let i=0;i<this.d.length;i++){const k=this.d[i];if(k){x.fillStyle=k;x.fillRect(i%this.w,(i/this.w)|0,1,1)}}return c}
}
function flip(src){const c=document.createElement('canvas');c.width=src.width;c.height=src.height;const x=c.getContext('2d');x.scale(-1,1);x.drawImage(src,-src.width,0);return c}
function whiten(src){const c=document.createElement('canvas');c.width=src.width;c.height=src.height;const x=c.getContext('2d');x.drawImage(src,0,0);x.globalCompositeOperation='source-in';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);return c}

const FONT={};
for(const ch in FONT_SRC){const rows=FONT_SRC[ch].split('|');let w=0;rows.forEach(r=>{const i=r.lastIndexOf('#');if(i+1>w)w=i+1});FONT[ch]={rows,w}}
const glyphCache={};
function glyph(ch,col){const k=ch+col;if(glyphCache[k])return glyphCache[k];const f=FONT[ch];const c=document.createElement('canvas');c.width=f.w||1;c.height=9;
  const x=c.getContext('2d');x.fillStyle=col;f.rows.forEach((r,y)=>{for(let i=0;i<r.length;i++)if(r[i]==='#')x.fillRect(i,y,1,1)});return glyphCache[k]=c}
function textW(s,scale=1){let w=0;for(const ch of s){const f=FONT[ch];w+=(f?f.w+1:3)*scale}return w}
function drawText(ctx,s,x,y,col,shadow,scale=1){let cx=x;for(const ch of s){const f=FONT[ch];if(!f){cx+=3*scale;continue}
  if(shadow){const sh=glyph(ch,shadow);for(const[a,b]of[[1,0],[0,1],[1,1]])ctx.drawImage(sh,cx+a*scale,y+b*scale,sh.width*scale,9*scale)}
  const gl=glyph(ch,col);ctx.drawImage(gl,cx,y,gl.width*scale,9*scale);cx+=(f.w+1)*scale}return cx-x}
function wrap(text,maxW){const lines=[];for(const para of text.split('\n')){let line='';for(const word of para.split(' ')){const t=line?line+' '+word:word;
  if(textW(t)>maxW&&line){lines.push(line);line=word}else line=t}lines.push(line)}return lines}

const OUTL='#302830';
function human(o,dir,frame){
  const p=new PC(16,22),side=dir==='left'||dir==='right';
  const{hair,hairS,skin,skinS,shirt,shirtS,pants,pantsS,shoes}=o;const K='#302830';
  if(!side){
    const back=dir==='up';
    if(o.long&&!back)p.rect(2,5,12,9,hair);
    const lL=frame===1?1:0,rL=frame===2?1:0;
    p.rect(5,16,3,4-lL,pants);p.rect(8,16,3,4-rL,pants);p.rect(8,17,1,3-rL,pantsS);
    p.rect(5,20-lL,3,2,shoes);p.rect(8,20-rL,3,2,shoes);
    p.rect(4,11,8,6,shirt);p.rect(11,11,1,6,shirtS);p.rect(4,16,8,1,pantsS);
    const aL=frame===2?1:0,aR=frame===1?1:0;
    p.rect(3,11+aL,1,4,shirtS);p.set(3,15+aL,skin);p.rect(12,11+aR,1,4,shirtS);p.set(12,15+aR,skin);
    p.ell(8,6,5,4.8,back?hair:skin);
    if(back){
      if(o.long){p.rect(3,6,10,9,hair);p.rect(4,14,8,1,hairS);p.rect(7,3,2,10,hairS)}
      else{p.rect(6,10,4,1,skinS);p.rect(6,3,4,1,hairS)}
      p.rect(5,0,6,1,hair);
    }else{
      p.masked([skin],()=>{p.rect(3,0,10,o.long?4:3,hair);p.rect(3,4,1,o.long?5:2,hair);p.rect(12,4,1,o.long?5:2,hair)});
      p.rect(5,0,6,1,hair);p.rect(5,2,2,1,hairS);
      p.rect(5,6,1,2,K);p.rect(10,6,1,2,K);
      p.set(4,8,skinS);p.set(11,8,skinS);p.set(7,9,skinS);p.set(8,9,skinS);
    }
  }else{
    if(frame===0){p.rect(6,16,4,4,pants);p.rect(6,20,5,2,shoes)}
    else if(frame===1){p.rect(4,16,3,4,pantsS);p.rect(9,16,3,4,pants);p.rect(3,20,4,2,shoes);p.rect(9,20,4,2,shoes)}
    else{p.rect(5,16,3,4,pantsS);p.rect(8,16,3,4,pants);p.rect(4,20,4,2,shoes);p.rect(8,20,4,2,shoes)}
    p.rect(5,11,6,6,shirt);p.rect(5,11,1,6,shirtS);
    p.ell(8.5,6,4.8,4.8,skin);
    p.masked([skin],()=>{p.rect(3,0,11,3,hair);p.rect(3,0,5,9,hair)});
    p.rect(5,0,6,1,hair);
    if(o.long){p.rect(4,6,3,9,hair);p.rect(4,14,3,1,hairS)}
    p.rect(11,6,1,2,K);p.set(13,7,skin);p.set(12,9,skinS);
    if(frame===1){p.rect(8,11,2,4,shirtS);p.rect(9,15,1,1,skin)}
    else if(frame===2){p.rect(6,11,2,4,shirtS);p.rect(6,15,1,1,skin)}
    else{p.rect(7,11,2,4,shirtS);p.rect(7,15,2,1,skin)}
  }
  if(o.messy){const h=o.hair,d=o.hairS;
    if(!side){[[4,0],[11,0],[2,3],[13,2],[1,7],[1,8],[14,10],[14,11],[2,14],[12,14],[13,14]].forEach(([x,y])=>p.set(x,y,h));p.set(6,1,d);p.set(10,1,d)}
    else{[[4,0],[11,0],[2,2],[2,3],[3,10],[3,13],[4,15]].forEach(([x,y])=>p.set(x,y,h));p.set(8,1,d)}}
  p.outline(OUTL);
  return dir==='left'?flip(p.canvas()):p.canvas();
}

function catOW(o,dir,frame){

function tone(f,t,d,type='square',v=0.05,f2){if(!AC)return null;const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);gn.gain.setValueAtTime(0.0001,t);gn.gain.linearRampToValueAtTime(v,t+0.008);
  gn.gain.setValueAtTime(v,t+d*0.65);gn.gain.linearRampToValueAtTime(0.0001,t+d);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+d+0.05);return{o,end:t+d}}

  if(bp){const fl=AC.createBiquadFilter();fl.type='bandpass';fl.frequency.value=bp;s.connect(fl);n=fl}
  n.connect(gn);gn.connect(master);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(0.001,t+d);s.start(t);s.stop(t+d)}

function update(dt){
  G.t+=dt;G.bumpT-=dt;
  for(let i=tasks.length-1;i>=0;i--){} // (order preserved below)
  const cur=tasks.splice(0);const keep=[];for(const f of cur){if(!f(dt))keep.push(f)}tasks.unshift(...keep);
  if(G.mode==='title'){if(input.pressed.a){G.mode='world';run(intro)}return}
  if(G.mode==='done'){G.doneT+=dt;if(G.doneT>4&&input.pressed.a)location.reload();return}
  // text
  if(G.text){const t=G.text;const len=t.pages[t.page].join('').length;
    if(t.chars<len){t.chars+=dt*55;if(input.pressed.a||input.pressed.b)t.chars=len}
    else if(t.auto!=null&&t.page===t.pages.length-1){t.autoT+=dt*1000;if(t.autoT>=t.auto){G.text=null;t.resolve()}}
    else if(input.pressed.a||input.pressed.b){sfx.blip();if(t.page<t.pages.length-1){t.page++;t.chars=0}else{G.text=null;t.resolve()}}}
  else if(G.menu){const m=G.menu;const p=input.pressed;
    if(p.left&&m.idx%2===1)m.idx--;if(p.right&&m.idx%2===0&&m.idx+1<m.options.length)m.idx++;
    if(p.up&&m.idx>=2)m.idx-=2;if(p.down&&m.idx+2<m.options.length)m.idx+=2;
    if(p.a){sfx.blip();G.menu=null;G.menu_mem[m.kind]=m.idx;m.resolve(m.options[m.idx])}
    else if(p.b&&m.cancel){G.menu=null;m.resolve(null)}}
  if(G.mode==='battle'){const B=G.battle;if(B){
    for(const[k,s]of[['ehp','ehpS'],['shp','shpS']]){const d=B[k]-B[s];B[s]=Math.abs(d)<=dt*25?B[k]:B[s]+Math.sign(d)*dt*25}
    B.eBlink=Math.max(0,B.eBlink-dt);B.pBlink=Math.max(0,B.pBlink-dt)}return}
  // world
  for(const e of G.map.ents)updEnt(e,dt);
  const P=G.player;
  if(!G.busy&&!G.text&&!G.menu&&!P.moving){
    const dir=getDir();
    if(input.pressed.b&&G.follower&&G.map.id==='route')run(toggleCar);
    else if(input.pressed.a)interact();
    else if(dir){if(dir!==P.dir&&!P.walking){P.dir=dir;P.turnT=0.09}else if(P.turnT>0)P.turnT-=dt;else tryMove(dir)}
    else{P.walking=false;P.turnT=0}}
  for(const p of G.pops)p.t+=dt;G.pops=G.pops.filter(p=>p.t<0.6);
  if(G.confettiOn&&Math.random()<0.6)G.confetti.push({x:Math.random()*W,y:-4,vx:(Math.random()-.5)*20,vy:20+Math.random()*30,c:pick(['#f05868','#f8d838','#58b8f0','#70d870','#f8f8f8','#e070e0']),heart:Math.random()<0.15});
  for(const c of G.confetti){c.x+=c.vx*dt;c.y+=c.vy*dt;c.x+=Math.sin(G.t*3+c.y*0.1)*0.3}G.confetti=G.confetti.filter(c=>c.y<H+4);
}

    const hs=Math.round(B.shpS)+'/'+SH_MAX;drawText(g,hs,230-textW(hs),96,'#383838','#d8d0b8');}
  rr(0,112,W,48,'#c8a858');rr(1,113,W-2,46,'#f0d888');rr(3,115,W-6,42,'#304858');rr(4,116,W-8,40,'#385870');
  const m=G.menu;
  if(m&&m.kind==='main'){drawText(g,'What will',10,121,'#f8f8f8','#586878');drawText(g,'SHERLOCK do?',10,137,'#f8f8f8','#586878');
    box(120,112,120,48,'#706888','#f8f8f8');rr(122,114,116,44,'#f8f8f8');menuGrid(m,[134,186],[122,138])}
  else if(m&&m.kind==='moves'){box(0,112,166,48,'#706888','#f8f8f8');menuGrid(m,[14,86],[122,138]);
    box(166,112,74,48,'#706888','#f8f8f8');drawText(g,'PP  --/--',172,121,'#484848','#d0d0c8');drawText(g,'TYPE/RUDE',172,137,'#484848','#d0d0c8')}
  renderTextBox()}
function menuGrid(m,xs,ys){m.options.forEach((o,i)=>{const x=xs[i%2],y=ys[i>>1];drawText(g,o,x,y,'#484848','#d0d0c8');
  if(i===m.idx){g.fillStyle='#484848';for(let k=0;k<4;k++)g.fillRect(x-8,y+1+k,1+Math.min(k,3-k),1)}})}
function ellipse(cx,cy,rx,ry){for(let y=-ry;y<=ry;y++){const w=Math.round(rx*Math.sqrt(1-(y*y)/(ry*ry)));g.fillRect(Math.round(cx-w),Math.round(cy+y),w*2,1)}}
function renderTitle(){
  for(let y=0;y<H;y+=4){const k=y/H;g.fillStyle=`rgb(${Math.round(248-k*60)},${Math.round(200-k*90)},${Math.round(208-k*40)})`;g.fillRect(0,y,W,4)}
  drawText(g,"LEE'S",Math.round((W-textW("LEE'S",3))/2),6,'#fff','#c03050',3);
  drawText(g,'BIRTHDAY QUEST',Math.round((W-textW('BIRTHDAY QUEST',2))/2),36,'#fff','#c03050',2);
  rr(0,118,W,42,'#88c060');rr(0,118,W,2,'#a8d880');
  const s=SPR.battle;const bob=k=>Math.round(Math.sin(G.t*3+k)*1.5);
  g.drawImage(s.spaghetti,8,62+bob(0));g.drawImage(s.zuki,88,58+bob(1));g.drawImage(s.meeps,168,62+bob(2));
  const sh=SPR.sherlock.down[0];g.drawImage(sh,170,4,32,32);
  if(Math.floor(G.t*2)%2===0){const tx=isTouch?'Tap to start':'Press Z / Enter to start';drawText(g,tx,Math.round((W-textW(tx))/2),142,'#fff','#305020')}}
function render(){
  if(G.mode==='title')renderTitle();
  else if(G.mode==='battle'&&G.battle)renderBattle();
  else if(G.mode==='done'){rr(0,0,W,H,'#000');if(G.doneT>4){const t='Press A to play again';drawText(g,t,Math.round((W-textW(t))/2),140,'#404048')}return}
  else if(G.map)renderWorld();
  if(G.wipe>0){const h=Math.round(G.wipe*80);rr(0,0,W,h,'#000');rr(0,H-h,W,h,'#000')}
  if(G.flash)rr(0,0,W,H,'#fff');
  if(G.fade>0){g.globalAlpha=Math.min(1,G.fade);rr(0,0,W,H,'#000');g.globalAlpha=1}}

function resize(){const vw=innerWidth,vh=innerHeight;const s=Math.min(vw/W,vh/H);const cw=Math.floor(W*s),ch=Math.floor(H*s);
  cv.style.width=cw+'px';cv.style.height=ch+'px';cv.style.left=((vw-cw)/2|0)+'px';cv.style.top=((vh-ch)/2|0)+'px';
  const dpr=window.devicePixelRatio||1;cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);out.imageSmoothingEnabled=false;
  document.documentElement.style.setProperty('--pad',Math.round(Math.min(vh*0.36,vw*0.2,190))+'px');
  document.getElementById('rotate').style.display=isTouch&&vh>vw?'flex':'none'}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));resize();

function boot(){
  SPR={lee:sheet((d,f)=>human(LOOK.lee,d,f)),paddy:sheet((d,f)=>human(LOOK.paddy,d,f)),battle:makeBattleSprites(),carrier:makeCarrier(),car:makeCar(),catIcon:makeCatIcon()};
  for(const k in CATS)SPR[k]=sheet((d,f)=>catOW(CATS[k],d,f));
  {const p=new PC(16,16);tallGrass(p);SPR.grassTop=p.canvas()}
  MAPS={route:buildMap('route'),gym:buildMap('gym')};
  G.player=ent({spr:'lee',h:22});
  G.sherlock=ent({spr:'sherlock',visible:false,talk:sherlockTalk});
  MAPS.route.ents.push(G.player,G.sherlock);
  const paddy=ent({spr:'paddy',h:22,talk:paddyTalk});place(paddy,7,2,'down');MAPS.gym.ents.push(paddy);
  // the player & Sherlock move between maps
  const origLoad=loadMap;
  loadMap=function(id){const m=MAPS[id];for(const e of[G.player,G.sherlock]){for(const k in MAPS)MAPS[k].ents=MAPS[k].ents.filter(x=>x!==e);m.ents.push(e)}G.map=m};
  G.player.onArrive=arrive;
  let last=performance.now();
  function frame(t){const dt=Math.min(0.05,(t-last)/1000);last=t;update(dt);render();
    out.imageSmoothingEnabled=false;out.drawImage(buf,0,0,cv.width,cv.height);input.pressed={};requestAnimationFrame(frame)}
  requestAnimationFrame(frame);
  window.G=G;window.__debug={SPR,battle:k=>run(()=>battle(k)),SPECIES,MAPS,loadMap:id=>loadMap(id),place,run};
}
boot();
